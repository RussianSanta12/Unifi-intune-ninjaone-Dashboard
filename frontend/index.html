<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stats Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <header class="dashboard-header">
      <img src="logo/logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
      <h1>Stats Dashboard</h1>
      <span id="last-updated" class="last-updated">Loading…</span>
    </header>

    <section class="panel panel-stats" id="panel-ninjaone">
      <h2>NinjaOne</h2>
      <div class="row">
        <div class="card">
          <span class="stat-value stat-bad" id="ninjaone-unhealthy">–</span>
          <span class="stat-label">Unhealthy</span>
        </div>
        <div class="card">
          <span class="stat-value stat-warn" id="ninjaone-attention">–</span>
          <span class="stat-label">Needs Attention</span>
        </div>
        <div class="card">
          <span class="stat-value" id="ninjaone-alerts">–</span>
          <span class="stat-label">Open Alerts</span>
        </div>
      </div>
      <div class="panel-footer" id="ninjaone-status"></div>
    </section>

    <section class="row row-grow">
      <div class="panel panel-issues" id="panel-tickets-it">
        <div class="panel-heading">
          <h3>IT Support Requests <span class="ticket-count" id="tickets-it-count"></span></h3>
          <div class="legend" id="tickets-it-legend"></div>
        </div>
        <ul class="issue-list" id="tickets-it"></ul>
        <div class="panel-footer" id="tickets-it-status"></div>
      </div>
      <div class="panel panel-issues" id="panel-tickets-av">
        <div class="panel-heading">
          <h3>AV Support Requests <span class="ticket-count" id="tickets-av-count"></span></h3>
          <div class="legend" id="tickets-av-legend"></div>
        </div>
        <ul class="issue-list" id="tickets-av"></ul>
        <div class="panel-footer" id="tickets-av-status"></div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
