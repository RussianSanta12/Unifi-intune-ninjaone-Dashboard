<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stats Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <header class="dashboard-header">
      <img src="logo/logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
      <h1>Stats Dashboard</h1>
      <span id="last-updated" class="last-updated">Loading…</span>
    </header>

    <section class="panel panel-week" id="panel-week">
      <div class="panel-heading">
        <h3>AV Events This Week <span class="ticket-count" id="week-count"></span></h3>
        <span class="month-label" id="week-range"></span>
      </div>
      <div class="week-grid" id="week"></div>
      <div class="panel-footer" id="week-status"></div>
    </section>

    <section class="row row-grow">
      <div class="panel panel-issues" id="panel-tickets-it">
        <div class="panel-heading">
          <h3>IT Support Requests <span class="ticket-count" id="tickets-it-count"></span></h3>
          <div class="legend" id="tickets-it-legend"></div>
        </div>
        <ul class="issue-list" id="tickets-it"></ul>
        <div class="panel-footer" id="tickets-it-status"></div>
      </div>
      <div class="panel panel-issues" id="panel-tickets-av">
        <div class="panel-heading">
          <h3>AV Support Requests <span class="ticket-count" id="tickets-av-count"></span></h3>
          <div class="legend cal-legend" id="tickets-av-legend"></div>
          <span class="month-label" id="tickets-av-month"></span>
        </div>
        <div class="cal-weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="cal-grid" id="tickets-av"></div>
        <div class="cal-next-month" id="tickets-av-next"></div>
        <div class="panel-footer" id="tickets-av-status"></div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
